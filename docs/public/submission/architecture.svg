<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#080b10"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#ade4fb"/></marker></defs><text x="36" y="44" font-family="Arial,sans-serif" font-size="12" fill="#ade4fb">MERCENTA / TRUST BOUNDARIES</text><text x="36" y="88" font-family="Arial,sans-serif" font-size="34" fill="#f2f6fa">From intent to protected margin.</text><text x="36" y="118" font-family="Arial,sans-serif" font-size="14" fill="#a5b6c4">Testnet transfers. Explicit confirmations. Inspectable evidence. No live goods or yield claims.</text><rect x="36" y="170" width="340" height="145" rx="10" fill="#101720" stroke="#293843"/><text x="56" y="204" font-family="Arial,sans-serif" font-size="19" fill="#f2f6fa">Wallet + frontend</text><text x="56" y="237" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">Wallet ownership sign-in</text><text x="56" y="260" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">Human reviews pinned budget and quote</text><text x="56" y="283" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">Wallet signs exact vault calls</text><rect x="430" y="170" width="340" height="145" rx="10" fill="#101720" stroke="#293843"/><text x="450" y="204" font-family="Arial,sans-serif" font-size="19" fill="#f2f6fa">Authenticated backend</text><text x="450" y="237" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">Owner-bound BFF / HMAC requests</text><text x="450" y="260" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">Bounded planner and deterministic policy</text><text x="450" y="283" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">Atomic purchase + immutable evidence</text><rect x="824" y="170" width="340" height="145" rx="10" fill="#101720" stroke="#293843"/><text x="844" y="204" font-family="Arial,sans-serif" font-size="19" fill="#f2f6fa">LLM providers</text><text x="844" y="237" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">Structured intent only; latest request</text><text x="844" y="260" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">No prices, private signing keys or authority</text><text x="844" y="283" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">Bounded response + provider cooldowns</text><rect x="36" y="380" width="340" height="170" rx="10" fill="#101720" stroke="#293843"/><text x="56" y="414" font-family="Arial,sans-serif" font-size="19" fill="#f2f6fa">Prepaid account / SQLite WAL</text><text x="56" y="447" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">Platform-custodied spending balance</text><text x="56" y="470" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">Sealed double-entry purchase journals</text><text x="56" y="493" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">Simulated digital-goods fulfillment</text><text x="56" y="516" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">Temporary cloud snapshots: read-only</text><rect x="430" y="380" width="340" height="170" rx="10" fill="#101720" stroke="#293843"/><text x="450" y="414" font-family="Arial,sans-serif" font-size="19" fill="#f2f6fa">Sale record + receipt proof</text><text x="450" y="447" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">COGS from owned test-order debit</text><text x="450" y="470" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">Gross is declared until payment is checked</text><text x="450" y="493" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">Distinct sender / exact test USDC receipt</text><text x="450" y="516" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">No automatic customer-account credit</text><rect x="824" y="380" width="340" height="170" rx="10" fill="#101720" stroke="#293843"/><text x="844" y="414" font-family="Arial,sans-serif" font-size="19" fill="#f2f6fa">Arc / seller-owned Profit Vault</text><text x="844" y="447" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">Stable per-sale ID and exact approval</text><text x="844" y="470" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">Separate Restock, Fees, Refund reserve</text><text x="844" y="493" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">Profit / Owner / Tax / OPEX budgets</text><text x="844" y="516" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">No admin custody; no live Earn / APY</text><path d="M376 240 L424 240" stroke="#ade4fb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M818 240 L776 240" stroke="#ade4fb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M200 321 L200 374" stroke="#ade4fb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M600 321 L600 374" stroke="#ade4fb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M776 463 L818 463" stroke="#ade4fb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="36" y="610" font-family="Arial,sans-serif" font-size="16" fill="#ade4fb">EVIDENCE: order IDs + sealed journals + testnet payment + verified allocation receipt</text><text x="36" y="650" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">A testnet transfer is not a certified commercial invoice. Profit locking is not staking.</text><text x="36" y="675" font-family="Arial,sans-serif" font-size="13" fill="#a5b6c4">Contract is testnet-only and not independently audited. Hackathon eligibility remains pending the official brief.</text></svg>